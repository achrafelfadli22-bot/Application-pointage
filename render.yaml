# Production-oriented Render Blueprint. Adjust plan sizes to match real traffic.
services:
  - type: web
    name: pointage360-web
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_URL
        fromService:
          type: web
          name: pointage360-api
          property: hostport

  - type: web
    name: pointage360-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: PASSWORD_POLICY_STRICT
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pointage360-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pointage360-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: AUTH_CONTEXT_CACHE_ENABLED
        value: "true"
      - key: AUTH_CONTEXT_CACHE_TTL_SECONDS
        value: "30"
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: pointage360
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: keyvalue
    name: pointage360-redis
    plan: 256mb
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot

databases:
  - name: pointage360-db
    plan: 0.5c-1g
    region: frankfurt
    databaseName: pointage360
    user: pointage360
    postgresMajorVersion: "16"
    diskSizeGB: 15
    ipAllowList: []
